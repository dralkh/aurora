[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-tray"
dynamic = ["version"]
description = "Aurora sleep calculator and alarm tray app for macOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "tzlocal>=5.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
aurora-tray = "aurora_tray.app:main"

[tool.setuptools]
packages = ["aurora_tray"]

[tool.setuptools.dynamic]
version = { attr = "aurora_tray.__version__" }

[tool.setuptools.package-data]
aurora_tray = ["qml/*.qml", "qml/*.js", "icons/*"]
