name: Aurora

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - 'tray/**'
      - 'package/**'
      - 'build-plasmoid.py'
      - '.github/workflows/tray.yml'
  pull_request:
    paths:
      - 'tray/**'
      - 'package/**'
      - 'build-plasmoid.py'
      - '.github/workflows/tray.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tray/pyproject.toml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e "tray"
      - name: Tray tests
        working-directory: tray
        run: python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Aurora-macos-arm64
          - os: windows-latest
            artifact: Aurora-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tray/pyproject.toml
      - name: Install
        run: python -m pip install -e "tray[build]"
      - name: Icons (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tray
          python packaging/make_icons.py
          iconutil -c icns packaging/build/aurora.iconset -o packaging/aurora.icns
      - name: Icons (Windows)
        if: runner.os == 'Windows'
        run: |
          cd tray
          python packaging/make_icons.py
      - name: Bundle
        working-directory: tray
        run: pyinstaller --noconfirm --clean packaging/Aurora.spec
      - name: Verify bundled timezone data (macOS)
        if: runner.os == 'macOS'
        run: find tray/dist/Aurora.app -path '*tzdata/zoneinfo/America/New_York' | grep -q .
      - name: Verify bundled timezone data (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "tray\dist\Aurora\_internal\tzdata\zoneinfo\America\New_York")) {
            throw "tzdata was not bundled"
          }
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./tray/dist/Aurora.app/Contents/MacOS/Aurora --self-test
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $process = Start-Process -FilePath "tray\dist\Aurora\Aurora.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p tray/dist/dmg
          cp -R tray/dist/Aurora.app tray/dist/dmg/
          ln -s /Applications tray/dist/dmg/Applications
          hdiutil create -volname Aurora -srcfolder tray/dist/dmg -ov -format UDZO tray/dist/${{ matrix.artifact }}.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'tray'); import aurora_tray; print(aurora_tray.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tray\packaging\aurora.iss
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            tray/dist/*.dmg
            tray/dist/*.exe

  plasmoid:
    name: Plasmoid package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build
        run: python build-plasmoid.py
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurora-plasmoid
          if-no-files-found: error
          path: dist/aurora.plasmoid

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plasmoid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.plasmoid
