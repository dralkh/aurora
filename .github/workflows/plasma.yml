name: Plasma widget

on:
  push:
    branches: [master, main]
    paths:
      - 'package/**'
      - 'tests/**'
      - 'install.sh'
      - 'install-alarm-service.py'
      - 'enable-tray.js'
      - 'build-plasmoid.py'
      - '.github/workflows/plasma.yml'
  pull_request:
    paths:
      - 'package/**'
      - 'tests/**'
      - 'install.sh'
      - 'install-alarm-service.py'
      - 'enable-tray.js'
      - 'build-plasmoid.py'
      - '.github/workflows/plasma.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Math tests
        run: node tests/math.test.cjs
      - name: Install
        run: python -m pip install -r tests/requirements.txt
      - name: Install desktop tools
        run: sudo apt-get update && sudo apt-get install -y dbus libnotify-bin libglib2.0-bin libpulse0 libasound2t64
      - name: Scheduling tests
        run: python -m unittest discover -s tests -p 'test_schedule_core.py'
      - name: Service tests
        run: python -m unittest discover -s tests -p 'test_service_logic.py'
      - name: D-Bus integration test
        run: |
          export PATH="${PATH}:/usr/lib/qt6/bin"
          dbus-run-session -- python tests/test_service_integration.py
      - name: QML tests (needs Plasma 6)
        run: |
          if command -v qmltestrunner >/dev/null && [ -d /usr/lib/x86_64-linux-gnu/qt6/qml/org/kde/plasma ]; then
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software qmltestrunner -input tests -o -,txt
          else
            echo "Skipped: install Plasma 6 QML modules to run the QML tests."
          fi
